name: unscroll
description: Take control of your screen time. Block Reels, Shorts & TikTok after your daily limit.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.3.0
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Local Storage
  shared_preferences: ^2.3.2

  # UI & Animations
  lottie: ^3.1.2
  confetti: ^0.7.0
  percent_indicator: ^4.2.3
  pin_code_fields: ^8.0.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

  # Utils
  intl: ^0.19.0
  crypto: ^3.0.3

  #flutter native screen
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/unscroll.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#000000"
  image: assets/icons/unscroll.png
  android: true
  ios: false
  android_gravity: center